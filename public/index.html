<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get FCM Token</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 60px auto;
        padding: 0 20px;
      }
      button {
        padding: 10px 18px;
        font-size: 16px;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        height: 120px;
        margin-top: 16px;
        font-family: monospace;
      }
      #status {
        margin-top: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>Get your FCM device token</h2>
    <button id="btn">Get Token</button>
    <p id="status"></p>
    <textarea
      id="token"
      readonly
      placeholder="Your token will appear here"
    ></textarea>
    <div id="topic-controls" hidden>
      <input id="topic" type="text" placeholder="Topic name" />
      <button id="subscribe" type="button">Subscribe</button>
      <button id="unsubscribe" type="button">Unsubscribe</button>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getMessaging,
        getToken,
        onMessage,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

      const status = document.getElementById("status");
      const tokenBox = document.getElementById("token");
      const button = document.getElementById("btn");
      const topicInput = document.getElementById("topic");
      const topicControls = document.getElementById("topic-controls");

      async function updateTopicSubscription(action) {
        const topic = topicInput.value;
        if (!tokenBox.value || !topic.trim()) {
          status.textContent = "Generate a token and enter a topic name.";
          return;
        }

        try {
          const response = await fetch(`/api/notifications/${action}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: tokenBox.value, topic }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Topic request failed.");
          }
          status.textContent = `Topic ${action} successful.`;
        } catch (err) {
          status.textContent =
            "Error: " + (err instanceof Error ? err.message : String(err));
          console.error(err);
        }
      }

      document
        .getElementById("subscribe")
        .addEventListener("click", () => updateTopicSubscription("subscribe"));
      document
        .getElementById("unsubscribe")
        .addEventListener("click", () => updateTopicSubscription("unsubscribe"));

      try {
        const response = await fetch("/api/firebase-config");
        const config = await response.json();
        if (!response.ok) {
          throw new Error(config.error || "Unable to load Firebase configuration.");
        }

        const app = initializeApp(config.firebaseConfig);
        const messaging = getMessaging(app);

        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const permission = await Notification.requestPermission();
            if (permission !== "granted") {
              status.textContent = "Notification permission denied.";
              return;
            }
            console.info("[FCM] Notification permission granted.");

            const registration = await navigator.serviceWorker.register(
              "/firebase-messaging-sw.js",
            );
            await navigator.serviceWorker.ready;
            if (!registration.active) {
              throw new Error("The Firebase service worker did not become active.");
            }
            console.info("[FCM] Service worker is active:", registration);

            const token = await getToken(messaging, {
              vapidKey: config.vapidKey,
              serviceWorkerRegistration: registration,
            });

            tokenBox.value = token;
            topicControls.hidden = false;
            status.textContent =
              "Token generated. Copy it into your curl request.";
            console.info("[FCM] Token generated:", token);
          } catch (err) {
            status.textContent =
              "Error: " + (err instanceof Error ? err.message : String(err));
            console.error(err);
          } finally {
            button.disabled = false;
          }
        });

        onMessage(messaging, (payload) => {
          alert(`${payload.notification.title}\n${payload.notification.body}`);
        });
      } catch (err) {
        button.disabled = true;
        status.textContent =
          "Error: " + (err instanceof Error ? err.message : String(err));
        console.error(err);
      }
    </script>
  </body>
</html>
